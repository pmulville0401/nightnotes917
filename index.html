<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tracker</title><link rel="stylesheet" href="styles.css"></head><body><div class="wrap"><h1>Construction Tracker</h1><div class="toolbar"><select id="projectFilter"></select><button id="exportAll">Export All</button><button id="exportOpen">Export Open</button><button id="exportClosed">Export Completed</button><button id="printBtn">Print</button></div><div class="form"><input id="project" placeholder="Project Name"><input id="title" placeholder="Item Title"><input id="assigned" placeholder="Assigned To"><select id="priority"><option>Low</option><option>Medium</option><option>High</option><option>Critical</option></select><textarea id="desc" placeholder="Description"></textarea><button id="createBtn" type="button">Create Item</button></div><div class="section open"><h2>Open Items (<span id="openCount">0</span>)</h2><table><thead><tr><th>Project</th><th>Priority</th><th>Title</th><th>Assigned</th><th>Created</th><th>Action</th></tr></thead><tbody id="openBody"></tbody></table></div><div class="section closed"><h2>Completed Items (<span id="closedCount">0</span>)</h2><table><thead><tr><th>Project</th><th>Priority</th><th>Title</th><th>Assigned</th><th>Created</th><th>Completed</th></tr></thead><tbody id="closedBody"></tbody></table></div><script src="app.js"></script></body></html>
