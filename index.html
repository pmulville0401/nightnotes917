<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tracker</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="wrap">
<h1>Night Notes Tracker</h1>
<div class="stats"><div id="openCount">Open: 0</div><div id="completeCount">Completed: 0</div></div>
<div class="form">
<h2>Add new note</h2>
<input id="project" placeholder="Project Name">
<input id="title" placeholder="Item Title">
<input id="assigned" placeholder="Assigned To">
<input id="due" type="date">
<select id="priority"><option>Low</option><option>Medium</option><option>High</option><option>Critical</option></select>
<textarea id="desc" placeholder="Description"></textarea>
<button onclick="addItem()">Create Item</button>
</div>
<h2>Full Notes</h2>
<select id="projectFilter" onchange="render()"><option>All Projects</option></select>
<button onclick="window.print()">Print Report</button>
<button onclick="exportExcel()">Export Excel</button>
<div class="open-section"><h2>🔴 Open Items</h2><div id="openItems"></div></div>
<div class="closed-section"><h2>✅ Completed Items</h2><div id="closedItems"></div></div>
</div>
<script src="app.js"></script>
</body>
</html>
