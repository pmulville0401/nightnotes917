<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Construction Tracker Pro</title><link rel="stylesheet" href="styles.css"></head><body><div class="wrap"><h1>Night Notes</h1><div class="toolbar"><select id="projectFilter" onchange="render()"><option>All Projects</option></select><button onclick="exportCSV('all')">Export All Items</button><button onclick="exportCSV('open')">Export Open Items</button><button onclick="exportCSV('closed')">Export Completed Items</button><button onclick="window.print()">Print Report</button></div><div class="stats"><div id="openCount"></div><div id="completeCount"></div></div><div class="form"><h2>Superintendent Input</h2><input id="project" placeholder="Project Name"><input id="title" placeholder="Item Title"><input id="assigned" placeholder="Assigned To"><input id="due" type="date"><select id="priority"><option>Low</option><option>Medium</option><option>High</option><option>Critical</option></select><textarea id="desc" placeholder="Description"></textarea><button onclick="addItem()">Create Item</button></div><div class="open-section"><h2>Open Items</h2><table><thead><tr><th>Project</th><th>Priority</th><th>Title</th><th>Assigned To</th><th>Created</th><th>Action</th></tr></thead><tbody id="openItems"></tbody></table></div><div class="closed-section"><h2>Completed Items</h2><table><thead><tr><th>Project</th><th>Priority</th><th>Title</th><th>Assigned To</th><th>Created</th><th>Completed</th></tr></thead><tbody id="closedItems"></tbody></table></div></div><script src="app.js"></script></body></html>
